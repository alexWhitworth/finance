name: Bug Report
description: Report a problem or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the details below.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: Tell us what went wrong
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps/code to reproduce the issue
      placeholder: |
        1. Run `...`
        2. Pass input `...`
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Which version, tag, or commit hash are you using?
      placeholder: e.g. v0.3.1 or commit abc1234
    validations:
      required: false

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: e.g. 3.13.14
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output / traceback
      render: shell
    validations:
      required: false

