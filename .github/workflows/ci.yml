name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Full history so git diff / diff-cover can compare against origin/master
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run tests
        run: uv run pytest
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NASDAQ_DATA_LINK_API_KEY: ${{ secrets.NASDAQ_DATA_LINK_API_KEY }}
      - name: Coverage of changed lines (diff-cover)
        # 1. Line-level coverage restricted to lines touched by this PR/branch.
        #    --fail-under=0 keeps this informational; raise it (e.g. 100) to
        #    enforce a diff-coverage gate. The overall 85% floor is enforced
        #    by [tool.coverage.report] fail_under during the test run.
        run: |
          uv run diff-cover coverage.xml \
            --compare-branch=origin/master \
            --fail-under=0 \
            --format markdown:diff-cover.md
          cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage of changed files
        # 2. File-level coverage of every .py file touched by this PR/branch
        #    (added, modified, or renamed; deleted files excluded).
        run: |
          CHANGED_FILES=$(git diff --name-only --diff-filter=d origin/master...HEAD \
            | { grep '\.py$' || true; } | paste -sd, -)
          if [ -n "$CHANGED_FILES" ]; then
            uv run coverage report --include="$CHANGED_FILES" --fail-under=0
          else
            echo "No changed Python files."
          fi
      - name: Overall library coverage
        # 3. Coverage of the entire src/finance package (fail_under=85 from
        #    pyproject.toml applies by default).
        run: uv run coverage report

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Lint with ruff
        run: uv run ruff check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Type-check with mypy
        run: uv run mypy src/
