[project]
name = "finance"
version = "1.1.2"
requires-python = ">=3.13"
dependencies = [
    "yfinance",
    "pandas",
    "plotnine",
    "numpy",
    "scipy",
    "pandas-stubs",
    "pyarrow",
    "python-dotenv",
    "fredapi"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "hypothesis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "yfinance.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fredapi.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["plotnine.*", "mizani.*"]
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = "finance.figures"
ignore_errors = true


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=xml --cov-report=term-missing"
markers = [
    "slow: marks tests as slow (network/I/O); deselect with -k 'not slow'",
]

[tool.coverage.run]
source = ["src/finance"]
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "scipy-stubs>=1.18.0.1",
]
